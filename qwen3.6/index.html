<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Francisco Piaggio — Frontend Engineer & Creative Coder</title>
  <meta name="description" content="Frontend engineer and creative coder from Buenos Aires, Argentina.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --text: #f0ece4;
      --text-muted: #8a8578;
      --accent: #c8ff00;
      --accent-dim: rgba(200, 255, 0, 0.08);
      --border: #2a2822;
      --serif: 'Instrument Serif', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 80%, rgba(200, 255, 0, 0.03) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 20%, rgba(200, 255, 0, 0.02) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .noise {
      position: fixed;
      inset: 0;
      opacity: 0.035;
      pointer-events: none;
      z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px;
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 720px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3.5rem 3rem;
      animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 20px;
      padding: 1px;
      background: linear-gradient(160deg, rgba(200, 255, 0, 0.15) 0%, transparent 40%, transparent 60%, rgba(200, 255, 0, 0.06) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .avatar-wrap {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 2rem;
      border: 2px solid var(--border);
      animation: fadeUp 0.6s 0.15s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .name {
      font-family: var(--serif);
      font-size: clamp(2.2rem, 5vw, 3rem);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 0.6rem;
      animation: fadeUp 0.6s 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .roles {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      animation: fadeUp 0.6s 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .role-primary {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: -0.01em;
    }

    .role-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .role-secondary {
      font-size: 1.05rem;
      font-weight: 400;
      color: var(--text-muted);
    }

    .tagline {
      font-size: 1.05rem;
      line-height: 1.65;
      color: var(--text-muted);
      max-width: 520px;
      margin-bottom: 2rem;
      animation: fadeUp 0.6s 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .tagline em {
      color: var(--text);
      font-style: normal;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1.25rem;
      padding-top: 1.75rem;
      border-top: 1px solid var(--border);
      animation: fadeUp 0.6s 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .meta-item svg {
      width: 15px;
      height: 15px;
      stroke: var(--text-muted);
      flex-shrink: 0;
    }

    .meta-item a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .meta-item a:hover {
      color: var(--accent);
    }

    .divider {
      width: 1px;
      height: 14px;
      background: var(--border);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      body { padding: 1rem; }
      .card { padding: 2.5rem 1.75rem; border-radius: 16px; }
      .meta { gap: 0.75rem 1rem; }
      .divider { display: none; }
    }
  </style>
</head>
<body>
