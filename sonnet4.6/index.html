<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Francisco Piaggio — Frontend Engineer &amp; Creative Coder</title>
  <meta name="description" content="Frontend engineer and creative coder from Buenos Aires, Argentina." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: rgba(255,255,255,0.07);
      --text: #e8e8f0;
      --muted: #7a7a9a;
      --accent: #7c6aff;
      --accent-soft: rgba(124,106,255,0.12);
      --green: #3ecf8e;
    }

    html { font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      line-height: 1.6;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glow orb */
    body::after {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(124,106,255,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 32px 64px rgba(0,0,0,0.4);
    }

    /* Avatar */
    .avatar-wrap {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--border);
      background: var(--bg);
      margin-bottom: 1.75rem;
      flex-shrink: 0;
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Fallback initials avatar */
    .avatar-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #3b2fa8, #7c6aff);
      color: #fff;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    /* Name */
    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 2.25rem;
      font-weight: 300;
      line-height: 1.15;
      letter-spacing: -0.03em;
      color: #ffffff;
      margin-bottom: 0.6rem;
    }

    /* Roles */
    .roles {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .role-primary {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .role-divider {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .role-secondary {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--muted);
    }

    /* Tagline */
    .tagline {
      font-size: 0.975rem;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 1.75rem;
      border-left: 2px solid var(--accent);
      padding-left: 0.9rem;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 1.5rem;
    }

    /* Meta info */
    .meta {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.75rem;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.875rem;
    }

    .meta-label {
      color: var(--muted);
      min-width: 70px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .meta-value {
      color: var(--text);
      font-weight: 500;
    }

    .meta-value a {
      color: var(--text);
      text-decoration: none;
      transition: color 0.15s;
    }

    .meta-value a:hover {
      color: var(--accent);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(62,207,142,0.1);
      color: var(--green);
      border: 1px solid rgba(62,207,142,0.2);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 500;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Contact links */
    .links {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      border: 1px solid var(--border);
      color: var(--muted);
      background: transparent;
      transition: all 0.15s;
    }

    .link:hover {
      color: var(--text);
      border-color: rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.04);
    }

    .link svg {
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="avatar-wrap">
      <img src="../profile.png" alt="Francisco Piaggio"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
      <div class="avatar-fallback" style="display:none">FP</div>
    </div>

    <h1>Francisco Piaggio</h1>

    <div class="roles">
      <span class="role-primary">Senior Frontend Engineer</span>
      <span class="role-divider">·</span>
      <span class="role-secondary">Creative Coder</span>
    </div>

    <p class="tagline">
      "Building scalable, high-performance web applications with clean architecture and pixel-perfect interfaces."
    </p>

    <div class="divider"></div>

    <div class="meta">
      <div class="meta-row">
        <span class="meta-label">Currently</span>
        <span class="meta-value">
          <span class="badge">Working at <a href="https://www.deel.com" target="_blank" rel="noopener">Deel</a></span>
        </span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Location</span>
        <span class="meta-value">Buenos Aires, Argentina</span>
      </div>
    </div>

    <div class="links">

</body>
</html>
