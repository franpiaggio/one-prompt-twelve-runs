<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francisco Piaggio — Frontend Engineer & Creative Coder</title>
    <meta name="description" content="Frontend engineer and creative coder from Buenos Aires, Argentina.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=JetBrains+Mono:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="cursor-glow"></div>
    <div class="dot-grid"></div>
    
    <main class="main-container">
        <div class="content-wrapper">
            <!-- Left Column: Identity -->
            <section class="identity-section">
                <div class="name-block">
                    <h1 class="name">
                        <span class="name-line">Francisco</span>
                        <span class="name-line">Piaggio</span>
                    </h1>
                    <div class="name-accent"></div>
                </div>
                
                <div class="roles-block">
                    <div class="role primary-role">
                        <span class="role-prompt">></span>
                        <span class="role-text" data-text="Senior Frontend Engineer"></span>
                        <span class="cursor-blink">_</span>
                    </div>
                    <div class="role secondary-role">
                        <span class="role-prompt">></span>
                        <span class="role-text">Creative Coder</span>
                        <span class="cursor-blink">_</span>
                    </div>
                </div>
            </section>

            <!-- Right Column: Info -->
            <section class="info-section">
                <div class="tagline-block">
                    <p class="tagline">
                        "Building scalable, high-performance web applications with clean architecture and pixel-perfect interfaces."
                    </p>
                </div>

                <div class="details-block">
                    <div class="detail-item employment">
                        <span class="detail-label">Current</span>
                        <a href="https://www.deel.com" target="_blank" rel="noopener noreferrer" class="detail-value company-link">
                            Deel
                            <svg class="link-arrow" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M1 11L11 1M11 1H3M11 1V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </a>
                    </div>
                    
                    <div class="detail-item location">
                        <span class="detail-label">Location</span>
                        <span class="detail-value">Buenos Aires, Argentina</span>
                    </div>
                </div>

                <div class="contact-block">
                    <span class="contact-label">Connect</span>
                    <nav class="contact-links">
                        <a href="https://github.com/franpiaggio" target="_blank" rel="noopener noreferrer" class="contact-link">
                            <span class="link-index">01</span>
                            <span class="link-name">GitHub</span>
                        </a>
                        <a href="https://x.com/fipiaggio" target="_blank" rel="noopener noreferrer" class="contact-link">
                            <span class="link-index">02</span>
                            <span class="link-name">X / Twitter</span>
                            <span class="link-handle">@fipiaggio</span>
                        </a>
                        <a href="mailto:fpiaggio92@gmail.com" class="contact-link">
                            <span class="link-index">03</span>
                            <span class="link-name">Email</span>
                        </a>
                    </nav>
                </div>
            </section>
        </div>

        <!-- Decorative Elements -->
        <div class="geo-shape geo-shape-1"></div>
        <div class="geo-shape geo-shape-2"></div>
        <div class="noise-overlay"></div>
    </main>

    <script src="js/main.js"></script>
<script src="../shared/banner.js?v=2" defer></script>
</body>
</html>
